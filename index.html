<script>
// --- Polyfill for Promise.race in very old browsers ---
if (typeof Promise.race === 'undefined') {
  Promise.race = function(promises) {
    return new Promise(function(resolve, reject) {
      for (var i = 0; i < promises.length; i++) {
        Promise.resolve(promises[i]).then(resolve, reject);
      }
    });
  };
}

// --- START OF CONVERTED CODE ---

// State management
let state = {
  userActualDate: new Date(),
  selectedMonth: new Date().getMonth() + 1,
  allScheduleItems: [],
  calendarScheduleItems: [],
  todayWeather: null,
  isLoading: true,
  isLoadingCalendar: false,
  error: null,
  isCalendarVisible: false,
  calendarFocusedMonth: new Date().getMonth() + 1,
};

// --- CONSTANTS ---
const SPREADSHEET_ID = '1utxuwDZsrLZ5cTq8uIPRdOmMvlE9O1IbE1ymsIey3Uo';
const MONTHS = Array.from({ length: 12 }, (_, i) => i + 1);
const DATA_YEAR = 2025;
const LOCATION_COLORS = {
  '東大':{background:"bg-red-50 border-red-200",circle:"bg-red-500",text:"text-red-700",icon:"🏛️"},
  '駒場':{background:"bg-blue-50 border-blue-200",circle:"bg-blue-500",text:"text-blue-700",icon:"🏫"},
  '本郷':{background:"bg-green-50 border-green-200",circle:"bg-green-500",text:"text-green-700",icon:"🏢"},
  '農学部':{background:"bg-yellow-50 border-yellow-200",circle:"bg-yellow-500",text:"text-yellow-700",icon:"🌾"},
  '織田フィールド':{background:"bg-purple-50 border-purple-200",circle:"bg-purple-500",text:"text-purple-700",icon:"🏃"},
  '織田':{background:"bg-purple-50 border-purple-200",circle:"bg-purple-500",text:"text-purple-700",icon:"🏃"},
  '補助競技場':{background:"bg-emerald-50 border-emerald-200",circle:"bg-emerald-500",text:"text-emerald-700",icon:"🏟️"},
  '補助':{background:"bg-emerald-50 border-emerald-200",circle:"bg-emerald-500",text:"text-emerald-700",icon:"🏟️"},
  '府中':{background:"bg-indigo-50 border-indigo-200",circle:"bg-indigo-500",text:"text-indigo-700",icon:"🏃‍♂️"},
  '武蔵野':{background:"bg-teal-50 border-teal-200",circle:"bg-teal-500",text:"text-teal-700",icon:"🌲"},
  '済美山':{background:"bg-orange-50 border-orange-200",circle:"bg-orange-500",text:"text-orange-700",icon:"⛰️"},
  'AGF':{background:"bg-amber-50 border-amber-200",circle:"bg-amber-500",text:"text-amber-700",icon:"🏟️"},
  'トラック':{background:"bg-rose-50 border-rose-200",circle:"bg-rose-500",text:"text-rose-700",icon:"🏁"},
  'ロード':{background:"bg-violet-50 border-violet-200",circle:"bg-violet-500",text:"text-violet-700",icon:"🛣️"},
  '競歩':{background:"bg-cyan-50 border-cyan-200",circle:"bg-cyan-500",text:"text-cyan-700",icon:"🚶‍♂️"},
  '東工戦':{background:"bg-pink-50 border-pink-200",circle:"bg-pink-500",text:"text-pink-700",icon:"🏆"},
  '外大':{background:"bg-lime-50 border-lime-200",circle:"bg-lime-500",text:"text-lime-700",icon:"🎯"},
  '試合':{background:"bg-red-50 border-red-200",circle:"bg-red-600",text:"text-red-700",icon:"🏅"},
  '大会':{background:"bg-red-50 border-red-200",circle:"bg-red-600",text:"text-red-700",icon:"🏅"},
  '調整':{background:"bg-slate-50 border-slate-200",circle:"bg-slate-400",text:"text-slate-700",icon:"⚖️"},
  '休み':{background:"bg-gray-50 border-gray-200",circle:"bg-gray-400",text:"text-gray-700",icon:"😴"},
  'オフ':{background:"bg-gray-50 border-gray-200",circle:"bg-gray-400",text:"text-gray-700",icon:"😴"},
  default:{background:"bg-gray-50 border-gray-200",circle:"bg-gray-400",text:"text-gray-700",icon:"📍"}
};

// --- UTILS ---
const dateUtils = {
  formatDate: (date) => `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日`,
  getCurrentDateKey: (date) => new Date(date.getFullYear(), date.getMonth(), date.getDate(), 0, 0, 0, 0).getTime(),
};

const locationUtils = {
  getLocationStyle: (location) => {
    const normalizedLocation = location.trim().toLowerCase();
    for (const [key, style] of Object.entries(LOCATION_COLORS)) {
      if (key === 'default') continue;
      if (normalizedLocation.includes(key.toLowerCase())) return style;
    }
    return LOCATION_COLORS.default;
  },
  getLocationCircleColor: (location) => locationUtils.getLocationStyle(location).circle,
  getLocationTextColor: (location) => locationUtils.getLocationStyle(location).text,
  getLocationIcon: (location) => locationUtils.getLocationStyle(location).icon,
};

// --- SERVICES ---
const weatherService = {
  getMockWeather: async (date, location) => {
    await new Promise(resolve => setTimeout(resolve, 300 + Math.random() * 400));
    const simpleHash = (str) => {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = ((hash << 5) - hash) + str.charCodeAt(i);
        hash |= 0;
      }
      return Math.abs(hash);
    };
    const dateStringSeed = `${date.getFullYear()}-${date.getMonth() + 1}-${date.getDate()}-${location}`;
    const seed = simpleHash(dateStringSeed);
    const conditions = ['晴れ', '曇り', '時々晴れ', '雨', '晴れのち曇り', '曇りのち雨'];
    const condition = conditions[seed % conditions.length];
    const month = date.getMonth();
    let temperature;
    if (month >= 5 && month <= 8) temperature = 25 + (seed % 10);
    else if (month >= 2 && month <= 4) temperature = 15 + (seed % 10);
    else if (month >= 9 && month <= 10) temperature = 18 + (seed % 10);
    else temperature = 5 + (seed % 8);
    if (condition.includes('雨')) temperature = Math.max(temperature - 2, 5);
    return { condition, temperature: parseFloat(temperature.toFixed(1)) };
  }
};

const scheduleService = {
  parseCsv: (csvText) => {
      const rows = [];
      let currentRow = [];
      let currentFieldChars = [];
      let inQuotes = false;
      const text = csvText.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
      for (let i = 0; i < text.length; i++) {
          const char = text[i];
          if (inQuotes) {
              if (char === '"') {
                  if (i + 1 < text.length && text[i + 1] === '"') {
                      currentFieldChars.push('"');
                      i++;
                  } else {
                      inQuotes = false;
                  }
              } else {
                  currentFieldChars.push(char);
              }
          } else {
              if (char === '"') {
                  inQuotes = true;
              } else if (char === ',') {
                  currentRow.push(currentFieldChars.join(''));
                  currentFieldChars = [];
              } else if (char === '\n') {
                  currentRow.push(currentFieldChars.join(''));
                  currentFieldChars = [];
                  if (currentRow.some(field => field.trim() !== '')) {
                      rows.push([...currentRow]);
                  }
                  currentRow = [];
              } else {
                  currentFieldChars.push(char);
              }
          }
      }
      if (currentFieldChars.length > 0 || (currentRow.length > 0 && text[text.length - 1] === ',')) {
           currentRow.push(currentFieldChars.join(''));
      }
      if (currentRow.some(field => field.trim() !== '')) {
          rows.push([...currentRow]);
      }
      return rows;
  },
  fetchAndParseSheetData: async (spreadsheetId, month, year) => {
    const possibleSheetNames = [`${month}月メニュー`, month < 10 ? `0${month}月メニュー` : null].filter(Boolean);
    let csvText = null;
    for (const sheetName of possibleSheetNames) {
        const timestamp = new Date().getTime();
        const url = `https://docs.google.com/spreadsheets/d/${spreadsheetId}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}&_${timestamp}`;
        try {
            const response = await fetch(url);
            if (!response.ok) continue;
            const text = await response.text();
            if (text.includes('<!DOCTYPE html>') || text.includes('google.visualization.Query.setResponse')) continue;
            csvText = text;
            break;
        } catch (e) {
            console.error('Fetch error:', e);
            continue;
        }
    }

    if (!csvText) {
      throw new Error(`${month}月の練習データが見つかりませんでした。`);
    }

    const allRecords = scheduleService.parseCsv(csvText);
    if (allRecords.length === 0) return [];

    const scheduleItems = [];
    const dataStartIndex = allRecords.length > 0 && allRecords[0].some(cell => cell.trim() !== '') ? 1 : 0;

    for (let i = dataStartIndex; i < allRecords.length; i++) {
        const columns = allRecords[i];
        if (columns.length === 0 || columns.every(col => col.trim() === '')) continue;
        const dateStrRaw = (columns[0] ?? '').trim();
        if (!dateStrRaw) continue;

        let day = null, cellMonth = null;
        if (dateStrRaw.includes('/')) {
            const parts = dateStrRaw.split('/');
            if (parts.length === 2) { cellMonth = parseInt(parts[0], 10); day = parseInt(parts[1], 10); }
        } else if (dateStrRaw.includes('月') && dateStrRaw.includes('日')) {
            const match = dateStrRaw.match(/(\d+)月\s*(\d+)日/);
            if (match) { cellMonth = parseInt(match[1], 10); day = parseInt(match[2], 10); }
        } else {
            const dayNum = parseInt(dateStrRaw, 10);
            if (!isNaN(dayNum) && dayNum >= 1 && dayNum <= 31) { day = dayNum; cellMonth = month; }
        }
        
        if (day === null || isNaN(day) || cellMonth !== month) continue;

        const dateKey = new Date(year, month - 1, day).getTime();
        if (isNaN(dateKey)) continue;

        const timeVal = columns[2] ?? '';
        const locationVal = (columns[3] ?? '').trim();
        const menuVal = (columns[4] ?? '').trim();
        if (timeVal.trim() === '' && locationVal === '' && menuVal === '') continue;

        scheduleItems.push({
            id: `${dateKey}-${i}`, day, dateStr: `${month}/${day}`,
            dayOfWeek: (columns[1] ?? '').trim(), time: timeVal,
            location: locationVal || '情報なし', menu: menuVal || '情報なし',
            pace: (columns[5] ?? '').trim() || '情報なし',
            strengthening: (columns[6] ?? '').trim() || '情報なし',
            notes: (columns[7] ?? '').trim() || '情報なし',
            dateKey
        });
    }
    return scheduleItems;
  }
};

// --- RENDER FUNCTIONS ---
function renderLoading(isLoading) {
  const mainContent = document.getElementById('main-content');
  if (isLoading) {
    let skeletons = '';
    for (let i = 0; i < 3; i++) {
      skeletons += `
        <div class="bg-white border border-gray-200 rounded-lg mb-3 overflow-hidden shadow-sm animate-pulse">
          <div class="p-3 md:p-4 flex justify-between items-center bg-gray-50 border-b border-gray-200">
            <div class="flex-1 min-w-0 space-y-2.5">
              <div class="flex items-center space-x-2 md:space-x-3">
                <div class="h-5 w-24 bg-gray-300 rounded-full"></div>
                <div class="h-4 w-16 bg-gray-300 rounded"></div>
              </div>
              <div class="flex items-center space-x-2 pl-1">
                <div class="h-3 w-3 bg-gray-300 rounded-full"></div>
                <div class="h-4 w-32 bg-gray-300 rounded"></div>
              </div>
            </div>
          </div>
        </div>`;
    }
    mainContent.innerHTML = skeletons;
  } else {
    // Content will be rendered by renderSchedule
  }
}

function renderMessage(type, message) {
    const mainContent = document.getElementById('main-content');
    const bgColor = type === 'error' ? 'bg-red-100' : 'bg-blue-50';
    const textColor = type === 'error' ? 'text-red-700' : 'text-blue-700';
    const borderColor = type === 'error' ? 'border-red-300' : 'border-blue-200';
    mainContent.innerHTML = `<div class="p-4 rounded-md text-center my-4 ${bgColor} ${textColor} ${borderColor}">${message}</div>`;
}

function renderMonthTabs() {
  const container = document.getElementById('month-tabs-container');
  container.innerHTML = MONTHS.map(month => {
    const isActive = month === state.selectedMonth;
    const isCurrentActualMonth = month === state.userActualDate.getMonth() + 1 && DATA_YEAR === state.userActualDate.getFullYear();
    let classes = 'px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap transition-all duration-200 ease-in-out';
    if (isActive) {
      classes += ' bg-blue-500 text-white shadow-md';
    } else if (isCurrentActualMonth) {
      classes += ' bg-blue-100 text-blue-700 hover:bg-blue-200';
    } else {
      classes += ' bg-gray-200 text-gray-700 hover:bg-gray-300';
    }
    return `<button data-month="${month}" class="${classes}" role="tab">${month}月</button>`;
  }).join('');
}

function renderSchedule() {
  const mainContent = document.getElementById('main-content');
  const userCurrentAbsoluteDateKey = dateUtils.getCurrentDateKey(state.userActualDate);
  
  const todayItems = state.allScheduleItems.filter(item => item.dateKey === userCurrentAbsoluteDateKey);
  const futureItems = state.allScheduleItems.filter(item => item.dateKey > userCurrentAbsoluteDateKey).sort((a, b) => a.dateKey - b.dateKey);
  const pastItems = state.allScheduleItems.filter(item => item.dateKey < userCurrentAbsoluteDateKey).sort((a, b) => a.dateKey - b.dateKey);

  if (state.allScheduleItems.length === 0) {
      renderMessage('info', `${DATA_YEAR}年${state.selectedMonth}月の練習データは登録されていません。`);
      return;
  }

  let contentHTML = '';

  if (todayItems.length > 0) {
    contentHTML += `<section class="mb-8"><h2 class="text-xl font-semibold border-b-2 pb-2 mb-4 text-blue-600 border-blue-300">今日の練習 (${state.userActualDate.getMonth() + 1}月${state.userActualDate.getDate()}日)</h2>`;
    contentHTML += todayItems.map(item => renderScheduleCard(item, 'today')).join('');
    contentHTML += `</section>`;
  }

  if (futureItems.length > 0) {
    contentHTML += `<section class="mb-8"><h2 class="text-xl font-semibold border-b-2 pb-2 mb-4 text-green-700 border-green-300">${state.selectedMonth}月の練習予定</h2>`;
    contentHTML += futureItems.map(item => renderScheduleCard(item, 'future')).join('');
    contentHTML += `</section>`;
  }

  if (pastItems.length > 0) {
    contentHTML += `<section><h2 class="text-xl font-semibold border-b-2 pb-2 mb-4 text-gray-600 border-gray-400">過去の練習 (${state.selectedMonth}月)</h2>`;
    contentHTML += pastItems.map(item => renderScheduleCard(item, 'past')).join('');
    contentHTML += `</section>`;
  }
  
  mainContent.innerHTML = contentHTML;
}

function renderScheduleCard(item, type) {
    let cardClasses = "bg-white border border-gray-200 rounded-lg mb-3 overflow-hidden shadow-md hover:shadow-lg transition-all duration-300 ease-in-out";
    let headerBgClass = "bg-gray-50";
    if (type === 'today') {
        cardClasses += " border-l-4 border-blue-500";
        headerBgClass = "bg-blue-50";
    } else if (type === 'past') {
        cardClasses += " opacity-80 border-l-4 border-gray-400 hover:opacity-100";
        headerBgClass = "bg-gray-100";
    } else {
        cardClasses += " border-l-4 border-green-500";
        headerBgClass = "bg-green-50";
    }

    const locationStyle = locationUtils.getLocationStyle(item.location);
    const hasPace = item.pace && item.pace.trim() !== '' && item.pace.toLowerCase() !== '情報なし';
    const hasStrengthening = item.strengthening && item.strengthening.trim() !== '' && item.strengthening.toLowerCase() !== '情報なし';
    const hasNotes = item.notes && item.notes.trim() !== '' && item.notes.toLowerCase() !== '情報なし';

    return `
    <div class="${cardClasses}" data-card-id="${item.id}">
      <div class="p-3 md:p-4 cursor-pointer flex justify-between items-center ${headerBgClass} border-b border-gray-200" onclick="toggleCard('${item.id}')">
        <div class="flex-1 min-w-0">
          <div class="flex items-center space-x-2 md:space-x-3 mb-1.5">
            <span class="inline-block px-3 py-1 text-xs font-bold rounded-full shadow-sm ${type === 'today' ? 'bg-blue-600 text-white' : type === 'future' ? 'bg-green-600 text-white' : 'bg-gray-500 text-white'}">${item.dateStr} (${item.dayOfWeek})</span>
            <span class="text-sm font-semibold text-gray-700">${item.time}</span>
          </div>
          <div class="flex items-center text-xs pl-1">
            <span class="mr-1.5 text-sm">${locationStyle.icon}</span>
            <span class="w-3 h-3 rounded-full mr-2 flex-shrink-0 ${locationStyle.circle} border border-white shadow-sm"></span>
            <span class="truncate font-medium ${locationStyle.text}">${item.location}</span>
          </div>
        </div>
        <div class="ml-2 md:ml-3 flex-shrink-0">
          <svg id="chevron-${item.id}" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-700" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
        </div>
      </div>
      <div id="content-${item.id}" class="transition-all duration-300 ease-in-out overflow-hidden max-h-0">
        <div class="bg-white p-3 md:p-4 grid grid-cols-1 md:grid-cols-2 gap-x-4 md:gap-x-6 gap-y-4">
          <div><p class="text-xs font-semibold text-gray-500 mb-0.5">練習メニュー</p><p class="text-sm text-gray-700 whitespace-pre-wrap">${item.menu}</p></div>
          ${hasPace ? `<div><p class="text-xs font-semibold text-gray-500 mb-0.5">ペース</p><p class="text-sm text-gray-700 whitespace-pre-wrap">${item.pace}</p></div>` : ''}
          ${hasStrengthening ? `<div><p class="text-xs font-semibold text-gray-500 mb-0.5">補強</p><p class="text-sm text-gray-700 whitespace-pre-wrap">${item.strengthening}</p></div>` : ''}
          ${hasNotes ? `<div><p class="text-xs font-semibold text-gray-500 mb-0.5">補足</p><p class="text-sm text-gray-700 whitespace-pre-wrap">${item.notes}</p></div>` : ''}
        </div>
      </div>
    </div>`;
}

function toggleCard(id) {
    const content = document.getElementById(`content-${id}`);
    const chevron = document.getElementById(`chevron-${id}`);
    if (content.style.maxHeight && content.style.maxHeight !== '0px') {
        content.style.maxHeight = '0px';
        chevron.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>';
    } else {
        content.style.maxHeight = content.scrollHeight + 'px';
        chevron.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path>';
    }
}

function renderHeader() {
    const headerInfo = document.getElementById('header-info');
    let weatherHTML = '';
    if (state.todayWeather && DATA_YEAR === state.userActualDate.getFullYear()) {
        weatherHTML = `<span class="ml-2">東京: ${state.todayWeather.condition}, ${state.todayWeather.temperature}°C</span>`;
    }
    headerInfo.innerHTML = `${dateUtils.formatDate(state.userActualDate)} ${weatherHTML}`;
}

function renderFooter() {
    const footerText = document.getElementById('footer-text');
    footerText.textContent = `© ${state.userActualDate.getFullYear()} TUATTF Schedule Viewer`;
}

// --- MAIN APP LOGIC ---
async function handleMonthChange(month) {
  state.selectedMonth = month;
  state.isLoading = true;
  state.error = null;
  renderLoading(true);
  renderMonthTabs(); // Re-render tabs to show active state
  try {
    state.allScheduleItems = await scheduleService.fetchAndParseSheetData(SPREADSHEET_ID, state.selectedMonth, DATA_YEAR);
    renderSchedule();
  } catch (e) {
    state.error = e.message;
    renderMessage('error', state.error);
  } finally {
    state.isLoading = false;
  }
}

async function init() {
  renderLoading(true);
  renderMonthTabs();
  renderFooter();

  // Fetch weather
  weatherService.getMockWeather(state.userActualDate, 'Tokyo').then(weather => {
    state.todayWeather = weather;
    renderHeader();
  });

  // Fetch initial schedule
  await handleMonthChange(state.selectedMonth);

  // Add event listeners
  document.getElementById('month-tabs-container').addEventListener('click', (e) => {
    if (e.target.tagName === 'BUTTON') {
      const month = parseInt(e.target.dataset.month, 10);
      if (month !== state.selectedMonth) {
        handleMonthChange(month);
      }
    }
  });
  
  // Modal listeners are not implemented in this simplified version
  document.getElementById('open-calendar-btn').style.display = 'none'; // Hide calendar button
}

// --- Run the app ---
document.addEventListener('DOMContentLoaded', init);

</script>
